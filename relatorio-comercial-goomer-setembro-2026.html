.num{font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;line-height:.9}

.wk b{font-weight:800;font-size:14px}.wk span{color:#b8bccb;font-weight:600;font-size:11px}.wk.hit b{color:var(--ok)}.wk.miss b{color:var(--ruim)}.wk.fer b{color:#c9cee0}
.hl{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

function buildRF(){const P=$('#p-rf');const R=DATA.rf;if(!R){P.innerHTML='<p class="hint" style="margin-top:24px">Sem dados de R&F.</p>';return;}
 const M=R.membros||[];const W=R.wks_iso||[];const nS=W.length;
 const tot=M.reduce((a,r)=>({reun:a.reun+r.reun,ch:a.ch+r.chamadas,mrr:a.mrr+r.mrr}),{reun:0,ch:0,mrr:0});
 const metaTot=R.meta_total||0;
 const realizadoMeta=M.filter(r=>r.meta).reduce((a,r)=>a+r.mrr,0);
 const pctMeta=metaTot?realizadoMeta/metaTot*100:0;
 const pc=p=>p>=100?'over':p>=80?'mid':'low';
 P.innerHTML=`
  <div class="subnav"><button class="subtab on" data-s="perf">Performance</button><button class="subtab" data-s="pot">Potencial de Marcas</button><button class="subtab" data-s="imp">Implementação</button></div>
  <div class="subpanel on" id="rf-perf">
  <section><div class="sec-title">Redes & Franquias <span class="sec-note">· Gabriel traz as marcas (funil de marcas) · Henrique traz as lojas de cada marca já aprovada (funil de lojas)</span></div>
   <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="k">Reuniões (mês)</div><div class="v num">${tot.reun}</div><div class="note">por dono do negócio</div></div>
    <div class="kpi"><div class="k">MRR gerado</div><div class="v num">${brl0(tot.mrr)}</div><div class="note">negócios fechados no mês</div></div>
    <div class="kpi"><div class="k">Chamadas (mês)</div><div class="v num">${tot.ch}</div><div class="note">total do time</div></div>
   </div></section>
  <section><div class="sec-title">Atividade por integrante</div>
   <div class="card" style="overflow-x:auto"><table id="rf-t"><thead><tr><th>Integrante</th><th>Reuniões</th><th>Chamadas</th><th>Meta</th><th>MRR gerado</th><th>% Meta</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div></section>
  <section><div class="sec-title">Meta × Realizado por semana <span class="sec-note">· semana anterior + 4 anteriores (ISO, crescente) · realizado / meta · Mês = mês atual</span></div>
   <div class="card" style="overflow-x:auto"><table class="mini" id="sm-rf"><thead><tr><th>Integrante</th>${W.map(w=>'<th>Sem '+w.wk+' · '+w.ini+'</th>').join('')}<th>Mês (${DATA.periodo})</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div></section>
  ${(R.franquias_smb&&R.franquias_smb.length)?`<section><div class="sec-title">Franquias fechadas por vendedores de SMB <span class="sec-note">· clientes com faixa de lojas ≥ 11 lojas · contam também no SMB</span></div>
   <div class="card"><table id="fr-smb"><thead><tr><th style="text-align:left">Vendedor</th><th>Franquias fechadas</th><th>MRR</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div></section>`:''}
  <section><div class="sec-title">Funil de Marcas · Gabriel Moura <span class="sec-note">· prospecção de novas redes/franquias (ex.: Camarada Camarão, Cacau Show) — cada marca passa por POC/geração de valor até aprovar a Goomer · clique numa barra pra ver as marcas da etapa</span></div>
   <div class="chartbox"><h3>Marcas por etapa do funil</h3><p>${R.marcas} marcas no pipeline de Redes</p><div class="cvs" style="height:340px"><canvas id="c-marcas"></canvas></div></div>
   <div class="marcas-box" id="mbox"><span class="hint">Clique numa barra do gráfico pra listar as marcas daquela etapa.</span></div></section>
  <section><div class="sec-title">Funil de Lojas · Henrique de Oliveira <span class="sec-note">· negócios de lojas de rede (faixa ≥ 11) na pipe de Vendas INBOUND, por etapa — fase de venda, antes da implementação</span></div>
   <div class="chartbox"><h3>Lojas de rede na pipe de vendas (INBOUND)</h3><p id="lojasv-sub"></p><div class="cvs" style="height:340px"><canvas id="c-lojasvenda"></canvas></div></div></section>
  </div>
  <div class="subpanel" id="rf-pot">
   ${R.potencial?`
   <section><div class="sec-title">Potencial de marcas <span class="sec-note">· quantas lojas faltam trazer por rede (alvo do Henrique) · gap = total de lojas − fechadas (ativas + em implementação)</span></div>
    <div class="filtro"><label>Marca</label><select id="pot-marca"></select><label style="margin-left:14px">Funil Macro</label><select id="pot-funilmacro"></select></div>
    <div class="kpis">
     <div class="kpi"><div class="k">Marcas com relação</div><div class="v num" id="pk-ncom">${R.potencial.resumo.n_com}</div><div class="note">de ${R.potencial.resumo.n_total} no HubSpot</div></div>
     <div class="kpi"><div class="k">Lojas fechadas</div><div class="v num" id="pk-fech">${nf(Math.round((R.potencial.resumo.soma_ativas_com||0)+(R.potencial.resumo.soma_impl_com||0)))}</div><div class="note" id="pk-fech-n">${nf(R.potencial.resumo.soma_ativas_com||0)} ativas · ${nf(R.potencial.resumo.soma_impl_com||0)} em impl.</div></div>
     <div class="kpi" style="border-color:#c9d4ff;background:#f5f7ff"><div class="k">Gap de lojas</div><div class="v num" id="pk-gap" style="color:var(--azul)">${nf(Math.round(R.potencial.resumo.soma_gap_com||0))}</div><div class="note">lojas a conquistar</div></div>
     <div class="kpi"><div class="k">Potencial total</div><div class="v num" id="pk-tot">${nf(Math.round(R.potencial.resumo.soma_total_lojas_com||0))}</div><div class="note">lojas dessas marcas</div></div>
    </div></section>
   <section><div class="grid2">
     <div class="chartbox"><h3>Top 12 marcas por gap de lojas</h3><p>onde está a maior oportunidade de expansão</p><div class="cvs" style="height:360px"><canvas id="c-potgap"></canvas></div></div>
     <div class="chartbox"><h3>Potencial por estágio do funil</h3><p>quantas marcas e quanto gap em cada fase</p><div style="overflow-x:auto"><table class="mini" id="pot-funil"><thead><tr><th style="text-align:left">Estágio</th><th>Marcas</th><th>Gap de lojas</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div></div>
   </div></section>
   <section><div class="sec-title">Detalhamento por marca</div>
    <details><summary class="vermais" id="pot-sum">Ver todas as ${R.potencial.com.length} marcas · clique nas colunas pra reordenar</summary>
    <div class="card" style="overflow-x:auto;margin-top:10px"><table id="pot-t"><thead><tr><th data-k="nome">Marca</th><th data-k="funil_macro_redes">Funil Macro</th><th data-k="total">Total lojas</th><th data-k="ativas">Ativas</th><th data-k="impl">Em impl.</th><th data-k="fechadas">Fechadas</th><th data-k="gap" class="active">Gap</th><th data-k="penetracao">Penetração</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div>
    <p class="hint" style="margin-top:8px">Marcas sem "N° de lojas totais" preenchido aparecem com Total/Gap em branco.</p></details></section>
   `:'<p class="hint" style="margin-top:24px">Sem dados de marcas — rode o passo de coleta do objeto brands do HubSpot (salva brands_v1.json).</p>'}
  </div>
  <div class="subpanel" id="rf-imp">
   ${R.implementacao?`
   <section><div class="sec-title">Implementação · Lojas do Henrique <span class="sec-note">· cada loja (PDV) ligada à sua rede pelo ID Goomer do estabelecimento · POC vs Expansão</span></div>
    <div class="filtro"><label>Marca</label><select id="imp-marca"></select></div>
    <div class="kpis">
     <div class="kpi"><div class="k">Em implementação</div><div class="v num" id="ik-nimpl">${R.implementacao.resumo.n_pdv_em_impl}</div><div class="note" id="ik-nimpl-n">${R.implementacao.resumo.n_poc_impl} POC · ${R.implementacao.resumo.n_exp_impl} Expansão</div></div>
     <div class="kpi"><div class="k">Tempo médio do processo</div><div class="v num"><span id="ik-tproc">${Math.round(R.implementacao.resumo.tempo_medio_processo_dias)}</span><span style="font-size:16px"> d</span></div><div class="note">da entrada até hoje</div></div>
     <div class="kpi"><div class="k">Rodando</div><div class="v num" id="ik-nrun">${R.implementacao.resumo.n_pdv_rodando}</div><div class="note" id="ik-nrun-n">${R.implementacao.resumo.n_poc_rodando} POC · ${R.implementacao.resumo.n_exp_rodando} Expansão</div></div>
     <div class="kpi"><div class="k">Tempo médio rodando</div><div class="v num"><span id="ik-trun">${Math.round(R.implementacao.resumo.tempo_medio_rodando_dias)}</span><span style="font-size:16px"> d</span></div><div class="note" id="ik-trun-n">${(R.implementacao.resumo.tempo_medio_rodando_dias/30).toFixed(1)} meses</div></div>
    </div></section>
   <section><div class="sec-title">Funil de implementação <span class="sec-note">depois da marca aprovar a Goomer, o Henrique traz as lojas da rede · etapas 1–8 em implementação · 9–10 rodando</span></div>
    <div class="chartbox"><h3>Lojas por etapa (1→10)</h3><p id="impfunil-sub"></p><div class="cvs" style="height:340px"><canvas id="c-impfunil"></canvas></div></div></section>
   <section><div class="grid2">
     <div class="chartbox"><h3>Lojas por etapa (em implementação)</h3><p id="imp-etapa-sub">onde estão as ${R.implementacao.resumo.n_pdv_em_impl} lojas em implementação</p><div class="cvs" style="height:300px"><canvas id="c-impetapa"></canvas></div></div>
     <div class="chartbox"><h3>Tempo médio por etapa</h3><p>onde o processo trava — gargalo em âmbar</p><table class="mini" id="imp-etapas"><thead><tr><th style="text-align:left">Etapa</th><th style="text-align:left">Média</th></tr></thead><tbody></tbody></table></div>
   </div></section>
   <section><div class="sec-title">Lojas em implementação</div>
    <details><summary class="vermais" id="imp-sum">Ver todas as ${R.implementacao.em_implementacao.length} lojas · passe o mouse no tempo total pra ver por etapa</summary>
    <div class="card" style="overflow-x:auto;margin-top:10px"><table id="imp-t"><thead><tr><th data-k="marca">Marca</th><th data-k="loja">Loja</th><th data-k="etapa_atual_label">Etapa atual</th><th data-k="tipo">Tipo</th><th data-k="tempo_total_dias" class="active">Tempo total (d)</th><th data-k="tempo_etapa_atual_dias">Na etapa (d)</th></tr></thead><tbody></tbody></table></div></details></section>
   <section><div class="sec-title">Maturidade das lojas rodando <span class="sec-note">· há quanto tempo já operam com a Goomer</span></div>
    <div class="bucket" id="run-buckets"></div></section>
   <section><div class="chartbox"><h3>Top marcas rodando</h3><p>marcas com mais lojas em operação</p><div class="cvs" style="height:320px"><canvas id="c-runmarca"></canvas></div></section>
   <section><div class="sec-title">Lojas rodando</div>
    <details><summary class="vermais" id="run-sum">Ver todas as ${R.implementacao.rodando.length} lojas · clique nas colunas pra reordenar</summary>
    <div class="card" style="overflow-x:auto;margin-top:10px"><table id="run-t"><thead><tr><th data-k="marca">Marca</th><th data-k="loja">Loja</th><th data-k="tipo">Tipo</th><th data-k="tempo_rodando_dias" class="active">Tempo rodando (d)</th><th data-k="meses">Meses</th></tr></thead><tbody></tbody></table></div></details></section>
   `:'<p class="hint" style="margin-top:24px">Sem dados de implementação — rode o passo de coleta da pipe [IMP] Pipe Implementação.</p>'}
  </div>`;
 // atividade por integrante
 const b=$('#rf-t tbody');
 M.forEach(r=>{const metaC=r.meta?brl0(r.meta):'<span class="z">—</span>';
   const pctC=r.meta?`<span class="pctlab ${pc(r.mrr/r.meta*100)}">${pctr(r.mrr/r.meta*100)}</span>`:'<span class="pctlab fer">sem meta</span>';
   b.appendChild(el('tr',null,`<td class="nome">${nomeRF(r)}</td><td>${r.reun}</td><td>${r.chamadas}</td><td>${metaC}</td><td class="val-money">${brl0(r.mrr)}</td><td style="text-align:right">${pctC}</td>`));});
 $('#rf-t tfoot').innerHTML=`<tr><td>Total</td><td>${tot.reun}</td><td>${tot.ch}</td><td>${metaTot?brl0(metaTot):'—'}</td><td class="val-money">${brl0(tot.mrr)}</td><td style="text-align:right">${metaTot?'<span class="pctlab '+pc(pctMeta)+'">'+pctr(pctMeta)+'</span>':'—'}</td></tr>`;
 // meta x realizado por semana (ISO) — igual SMB
 (function(){const bb=$('#sm-rf tbody');const tr=Array(nS).fill(0),tm=Array(nS).fill(0);
   M.forEach(r=>{const sem=r.sem_iso||[];const mm=R.metasem_iso[r.nome]||[];let cells='';
     for(let i=0;i<nS;i++){const rz=sem[i]||0,mv=mm[i]||0;tr[i]+=rz;tm[i]+=mv;
       if(r.meta){cells+=`<td class="wk ${rz>=mv?'hit':'miss'}"><b>${brl0(rz).replace('R$ ','')}</b><span>/${brl0(mv).replace('R$ ','')}</span></td>`;}
       else{cells+=`<td class="wk"><b>${rz?brl0(rz).replace('R$ ',''):'0'}</b></td>`;}}
     const mesCell=r.meta?`<td class="wk ${r.mrr>=r.meta?'hit':'miss'}"><b>${brl0(r.mrr).replace('R$ ','')}</b><span>/${brl0(r.meta).replace('R$ ','')}</span></td>`:`<td class="wk"><b>${brl0(r.mrr).replace('R$ ','')}</b></td>`;
     bb.appendChild(el('tr',null,`<td>${nomeRF(r)}</td>`+cells+mesCell));});
   let f='';for(let i=0;i<nS;i++){f+=`<td class="wk"><b>${brl0(tr[i]).replace('R$ ','')}</b></td>`;}
   const mesTot=`<td class="wk"><b>${brl0(tot.mrr).replace('R$ ','')}</b></td>`;
   $('#sm-rf tfoot').innerHTML=`<tr><td>Time</td>`+f+mesTot+`</tr>`;})();

 // franquias fechadas por vendedores de SMB (tabela separada)
 (function(){const FS=R.franquias_smb||[];if(!FS.length)return;const bb=$('#fr-smb tbody');
   FS.forEach(r=>bb.appendChild(el('tr',null,`<td class="nome">${nomeSr(r)}</td><td>${r.n}</td><td class="val-money">${brl0(r.mrr)}</td>`)));
   const tn=FS.reduce((a,r)=>a+r.n,0),tm=FS.reduce((a,r)=>a+r.mrr,0);
   $('#fr-smb tfoot').innerHTML=`<tr><td>Total</td><td>${tn}</td><td class="val-money">${brl0(tm)}</td></tr>`;})();
 // funil marcas
 const labels=R.etapas.map(e=>e[0]);
 new Chart($('#c-marcas'),{type:'bar',
   data:{labels:labels,datasets:[{data:R.etapas.map(e=>e[1]),backgroundColor:'#2b00ff',hoverBackgroundColor:'#ff9700',borderRadius:5}]},
   options:{indexAxis:'y',maintainAspectRatio:false,
     plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' marcas · clique pra ver'}}},
     scales:{x:{beginAtZero:true,grid:{color:'#eef0f7'},ticks:{precision:0}},y:{grid:{display:false}}},
     onClick:function(e,els){if(!els.length)return;var et=labels[els[0].index];var ms=R.marcas_por_etapa[et]||[];
       $('#mbox').innerHTML='<h4>'+et+' · '+ms.length+' marca(s)</h4><div class="chips">'+ms.map(function(m){return '<span class="mchip">'+m+'</span>';}).join('')+'</div>';}
   }
 });
 // Funil de Lojas (Henrique) — negócios na pipe de Vendas INBOUND (faixa>=11), por etapa [aba Performance]
 (function(){const LV=R.lojas_venda_funil;const cv=$('#c-lojasvenda');if(!cv)return;
   const et=(LV&&LV.etapas)||[];
   if(!et.length){if(cv.closest('section'))cv.closest('section').remove();return;}
   const tot=et.reduce((a,e)=>a+e[1],0);const sub=$('#lojasv-sub');
   if(sub)sub.textContent=tot+' negócios de lojas de rede na pipe'+(LV.ganhos!=null?(' · '+LV.ganhos+' já ganhos'):'')+(LV.perdidos!=null?(' · '+LV.perdidos+' perdidos'):'');
   new Chart(cv,{type:'bar',data:{labels:et.map(e=>e[0]),datasets:[{data:et.map(e=>e[1]),backgroundColor:'#1d84ff',hoverBackgroundColor:'#ff9700',borderRadius:5}]},
     options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' negócio(s)'}}},
       scales:{x:{beginAtZero:true,grid:{color:'#eef0f7'},ticks:{precision:0}},y:{grid:{display:false}}}}});})();
 // Funil de implementação (lojas por etapa 1->10) — [aba Implementação]
 (function(){const FL=R.funil_lojas;const cv=$('#c-impfunil');if(!cv)return;
   if(!FL||!FL.length){if(cv.closest('section'))cv.closest('section').remove();return;}
   const tot=FL.reduce((a,e)=>a+e[1],0);const sub=$('#impfunil-sub');if(sub)sub.textContent=tot+' lojas · etapas 1–8 = em implementação · 9–10 = rodando';
   new Chart(cv,{type:'bar',data:{labels:FL.map(e=>e[0]),datasets:[{data:FL.map(e=>e[1]),backgroundColor:'#1d84ff',hoverBackgroundColor:'#ff9700',borderRadius:5}]},
     options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' loja(s)'}}},
       scales:{x:{beginAtZero:true,grid:{color:'#eef0f7'},ticks:{precision:0}},y:{grid:{display:false}}}}});})();
 let potChart=null,impEtapaChart=null,runMarcaChart=null;
 const freshThead=tb=>{const th=tb.querySelector('thead');const c=th.cloneNode(true);th.parentNode.replaceChild(c,th);};
 // Visão 1 — Potencial de marcas (gap) com filtro de marca
 if(R.potencial){const COM=R.potencial.com;
   const fmtn=v=>(v==null||v==='')?'<span class="z">—</span>':nf(Math.round(v));
   const fmtp=v=>(v==null||v==='')?'<span class="z">—</span>':pctr(v*100);
   (function(){const sel=$('#pot-marca');const nomes=COM.map(r=>r.nome).sort((a,b)=>a.localeCompare(b));
     sel.innerHTML='<option value="__all__">Todas as marcas ('+COM.length+')</option>'+nomes.map(n=>'<option>'+n+'</option>').join('');
     const fmsel=$('#pot-funilmacro');const fms=[...new Set(COM.map(r=>r.funil_macro_redes).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
     fmsel.innerHTML='<option value="__all__">Todos os estágios</option>'+fms.map(f=>'<option>'+f+'</option>').join('');
     sel.addEventListener('change',()=>renderPot());fmsel.addEventListener('change',()=>renderPot());})();
   function renderPot(){
     const selName=$('#pot-marca').value, fmName=$('#pot-funilmacro').value;
     let PT=(!selName||selName==='__all__')?COM:COM.filter(r=>r.nome===selName);
     if(fmName&&fmName!=='__all__') PT=PT.filter(r=>(r.funil_macro_redes||'')===fmName);
     const K=PT.reduce((a,r)=>({t:a.t+(r.total||0),at:a.at+(r.ativas||0),im:a.im+(r.impl||0),gp:a.gp+(r.gap||0)}),{t:0,at:0,im:0,gp:0});
     $('#pk-ncom').textContent=PT.length;
     $('#pk-fech').textContent=nf(Math.round(K.at+K.im));$('#pk-fech-n').innerHTML=nf(K.at)+' ativas · '+nf(K.im)+' em impl.';
     $('#pk-gap').textContent=nf(Math.round(K.gp));$('#pk-tot').textContent=nf(Math.round(K.t));
     $('#pot-sum').textContent=(PT.length===COM.length?('Ver todas as '+COM.length+' marcas'):('Ver detalhe da marca ('+PT.length+')'))+' · clique nas colunas pra reordenar';
     const tb=$('#pot-t');freshThead(tb);
     sortTable(tb,PT,(rows)=>{const b=tb.querySelector('tbody');b.innerHTML='';
       rows.forEach(r=>b.appendChild(el('tr',null,`<td class="nome">${r.nome}</td><td style="text-align:left">${r.funil_macro_redes||'<span class="z">—</span>'}</td><td>${fmtn(r.total)}</td><td>${fmtn(r.ativas)}</td><td>${fmtn(r.impl)}</td><td>${fmtn(r.fechadas)}</td><td class="val-money">${fmtn(r.gap)}</td><td>${fmtp(r.penetracao)}</td>`)));
       const sT=PT.reduce((a,r)=>({t:a.t+(r.total||0),at:a.at+(r.ativas||0),im:a.im+(r.impl||0),fe:a.fe+(r.fechadas||0),gp:a.gp+(r.gap||0)}),{t:0,at:0,im:0,fe:0,gp:0});
       tb.querySelector('tfoot').innerHTML=`<tr><td>Total (${PT.length})</td><td></td><td>${nf(Math.round(sT.t))}</td><td>${nf(Math.round(sT.at))}</td><td>${nf(Math.round(sT.im))}</td><td>${nf(Math.round(sT.fe))}</td><td class="val-money">${nf(Math.round(sT.gp))}</td><td></td></tr>`;},'gap');
     (function(){const ORD=['Em Negociação','Proj/POC (DEV/Int PDV)','Proj/POC (Em imp)','Proj/POC (Gerando Valor)','Proj. Expansão Inicial','Proj. Expansão Acelerada','Proj. Expansão Retenção'];
       const g={};PT.forEach(r=>{const k=r.funil_macro_redes||'Sem estágio';(g[k]=g[k]||{n:0,gap:0}).n++;g[k].gap+=(r.gap||0);});
       const keys=[...ORD.filter(k=>g[k]),...Object.keys(g).filter(k=>!ORD.includes(k))];
       const bb=$('#pot-funil tbody');bb.innerHTML=keys.map(k=>`<tr><td style="text-align:left">${k}</td><td>${g[k].n}</td><td class="val-money">${nf(Math.round(g[k].gap))}</td></tr>`).join('');
       const tn=keys.reduce((a,k)=>a+g[k].n,0),tg=keys.reduce((a,k)=>a+g[k].gap,0);
       $('#pot-funil tfoot').innerHTML=`<tr><td style="text-align:left">Total</td><td>${tn}</td><td class="val-money">${nf(Math.round(tg))}</td></tr>`;})();
     if(potChart)potChart.destroy();
     const top=[...PT].filter(r=>r.gap!=null).sort((a,b)=>b.gap-a.gap).slice(0,12);
     potChart=new Chart($('#c-potgap'),{type:'bar',data:{labels:top.map(r=>r.nome),datasets:[{data:top.map(r=>r.gap),backgroundColor:'#2b00ff',hoverBackgroundColor:'#ff9700',borderRadius:5}]},
       options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>nf(c.parsed.x)+' lojas de gap'}}},
         scales:{x:{beginAtZero:true,grid:{color:'#eef0f7'}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
   }
   renderPot();
 }
 // Visões 2/3 — Implementação com filtro de marca
 if(R.implementacao){const IM=R.implementacao;
   const tagT=t=>t==='POC'?'<span class="tag-poc">POC</span>':'<span class="tag-exp">Expansão</span>';
   (function(){const sel=$('#imp-marca');const set=new Set();(IM.em_implementacao||[]).forEach(r=>set.add(r.marca));(IM.rodando||[]).forEach(r=>set.add(r.marca));
     const nomes=[...set].sort((a,b)=>a.localeCompare(b));
     sel.innerHTML='<option value="__all__">Todas as marcas ('+nomes.length+')</option>'+nomes.map(n=>'<option>'+n+'</option>').join('');
     sel.addEventListener('change',()=>renderImp(sel.value));})();
   function renderImp(selName){
     const all=(!selName||selName==='__all__');
     const EM=all?(IM.em_implementacao||[]):(IM.em_implementacao||[]).filter(r=>r.marca===selName);
     const RUN=all?(IM.rodando||[]):(IM.rodando||[]).filter(r=>r.marca===selName);
     const npoc=a=>a.filter(r=>r.tipo==='POC').length;
     $('#ik-nimpl').textContent=EM.length;$('#ik-nimpl-n').textContent=npoc(EM)+' POC · '+(EM.length-npoc(EM))+' Expansão';
     $('#ik-tproc').textContent=EM.length?Math.round(EM.reduce((a,r)=>a+(r.tempo_total_dias||0),0)/EM.length):0;
     $('#ik-nrun').textContent=RUN.length;$('#ik-nrun-n').textContent=npoc(RUN)+' POC · '+(RUN.length-npoc(RUN))+' Expansão';
     const trun=RUN.length?Math.round(RUN.reduce((a,r)=>a+(r.tempo_rodando_dias||0),0)/RUN.length):0;
     $('#ik-trun').textContent=trun;$('#ik-trun-n').textContent=(trun/30).toFixed(1)+' meses';
     $('#imp-etapa-sub').textContent='onde estão as '+EM.length+' lojas em implementação';
     $('#imp-sum').textContent=(all?('Ver todas as '+EM.length+' lojas'):('Ver as '+EM.length+' loja(s) da marca'))+' · passe o mouse no tempo total pra ver por etapa';
     $('#run-sum').textContent=(all?('Ver todas as '+RUN.length+' lojas'):('Ver as '+RUN.length+' loja(s) da marca'))+' · clique nas colunas pra reordenar';
     // tempo médio por etapa
     (function(){let te;
       if(all){te=IM.resumo.tempo_medio_por_etapa||{};}
       else{const acc={};EM.forEach(r=>{Object.entries(r.tempo_por_etapa||{}).forEach(([k,v])=>{(acc[k]=acc[k]||[]).push(v);});});
         te={};Object.keys(acc).forEach(k=>te[k]=Math.round(acc[k].reduce((a,b)=>a+b,0)/acc[k].length));}
       const b=$('#imp-etapas tbody');const ks=Object.keys(te);
       if(!ks.length){b.innerHTML='<tr><td colspan="2" style="text-align:left;color:#8a90a6">Sem lojas em implementação para esta marca.</td></tr>';return;}
       const mx=Math.max(1,...Object.values(te));
       b.innerHTML=ks.map(k=>`<tr><td style="text-align:left">${k}</td><td style="text-align:left"><div class="barwrap" style="justify-content:flex-start"><div class="bar" style="width:140px"><i class="${te[k]>=mx*0.8?'over':''}" style="width:${te[k]/mx*100}%"></i></div><b style="margin-left:6px">${te[k]} d</b></div></td></tr>`).join('');})();
     // tabela em implementação
     (function(){const tb=$('#imp-t');freshThead(tb);
       sortTable(tb,EM,(rr)=>{const b=tb.querySelector('tbody');b.innerHTML='';
         rr.forEach(r=>{const det=Object.entries(r.tempo_por_etapa||{}).map(([k,v])=>k+': '+v+'d').join(' · ');
           b.appendChild(el('tr',null,`<td class="nome">${r.marca}</td><td style="text-align:left">${r.loja}</td><td style="text-align:left">${r.etapa_atual_label}</td><td>${tagT(r.tipo)}</td><td class="val-money" title="${det}">${r.tempo_total_dias}</td><td>${r.tempo_etapa_atual_dias}</td>`));});},'tempo_total_dias');})();
     // chart lojas por etapa
     (function(){const g={};EM.forEach(r=>{g[r.etapa_atual_label]=(g[r.etapa_atual_label]||0)+1;});
       const ks=Object.keys(g).sort((a,b)=>g[b]-g[a]);
       if(impEtapaChart)impEtapaChart.destroy();
       impEtapaChart=new Chart($('#c-impetapa'),{type:'bar',data:{labels:ks,datasets:[{data:ks.map(k=>g[k]),backgroundColor:'#2b00ff',hoverBackgroundColor:'#ff9700',borderRadius:5}]},
         options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' loja(s)'}}},
           scales:{x:{beginAtZero:true,grid:{color:'#eef0f7'},ticks:{precision:0}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});})();
     // buckets maturidade
     (function(){const B=[['0–3 meses',0,90],['3–6 meses',91,180],['6–12 meses',181,365],['+12 meses',366,1e9]];
       const cnt=B.map(()=>0);RUN.forEach(r=>{const d=r.tempo_rodando_dias;for(let i=0;i<B.length;i++){if(d>=B[i][1]&&d<=B[i][2]){cnt[i]++;break;}}});
       $('#run-buckets').innerHTML=B.map((b,i)=>`<div class="bkt"><div class="bn">${cnt[i]}</div><div class="bl">${b[0]}</div></div>`).join('');})();
     // chart top marcas rodando
     (function(){const g={};RUN.forEach(r=>{g[r.marca]=(g[r.marca]||0)+1;});
       const top=Object.keys(g).sort((a,b)=>g[b]-g[a]).slice(0,10);
       if(runMarcaChart)runMarcaChart.destroy();
       runMarcaChart=new Chart($('#c-runmarca'),{type:'bar',data:{labels:top,datasets:[{data:top.map(k=>g[k]),backgroundColor:'#2b00ff',hoverBackgroundColor:'#ff9700',borderRadius:5}]},
         options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' lojas rodando'}}},
           scales:{x:{beginAtZero:true,grid:{color:'#eef0f7'},ticks:{precision:0}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});})();
     // tabela rodando
     (function(){const tb=$('#run-t');freshThead(tb);const rows=RUN.map(r=>({...r,meses:+(r.tempo_rodando_dias/30).toFixed(1)}));
       sortTable(tb,rows,(rr)=>{const b=tb.querySelector('tbody');b.innerHTML='';
         rr.forEach(r=>b.appendChild(el('tr',null,`<td class="nome">${r.marca}</td><td style="text-align:left">${r.loja}</td><td>${tagT(r.tipo)}</td><td class="val-money">${r.tempo_rodando_dias}</td><td>${r.meses}</td>`)));},'tempo_rodando_dias');})();
   }
   renderImp('__all__');
 }
 // sub-abas
 P.querySelectorAll('.subtab').forEach(bt=>bt.addEventListener('click',()=>{
   P.querySelectorAll('.subtab').forEach(x=>x.classList.remove('on'));
   P.querySelectorAll('.subpanel').forEach(x=>x.classList.remove('on'));
   bt.classList.add('on');P.querySelector('#rf-'+bt.dataset.s).classList.add('on');
   if(bt.dataset.s==='pot'&&potChart)potChart.resize();
   if(bt.dataset.s==='imp'){if(impEtapaChart)impEtapaChart.resize();if(runMarcaChart)runMarcaChart.resize();}}));
}
// tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');document.getElementById('p-'+t.dataset.p).classList.add('on');
  if(t.dataset.p==='vendas'&&!vBuilt){buildV();vBuilt=true;}
  if(t.dataset.p==='rf'&&!rfBuilt){buildRF();rfBuilt=true;}
}));
</script>
