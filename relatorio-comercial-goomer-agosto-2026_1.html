.num{font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;line-height:.9}

.sec-title::before{content:"";width:22px;height:3px;background:var(--azul);border-radius:2px}

     const lCell=`<td class="liccol">${v.lic?nf(v.lic):'<span class="z">—</span>'}</td>`;
     const oCells=others.map(c=>`<td class="prodcol">${(v.prod&&v.prod[c])?brl0(v.prod[c]):'<span class="z">—</span>'}</td>`).join('');
     b.appendChild(el('tr',null,`<td class="pos">${v.ferias?'–':i+1}</td><td class="nome">${nomeSr(v)}</td><td>${brl0(v.meta)}</td><td class="val-money">${brl(v.mrr)}</td><td>${lab}</td>${tCell}${lCell}${oCells}<td>${v.n}</td><td class="hide-sm">${v.reun}</td>`));});
   const others=(V.prod_cols||[]).filter(c=>c!=='Tablet');
   const tTot=(V.prod_cols||[]).includes('Tablet')?`<td class="prodcol">${brl0(V.vend.reduce((a,v)=>a+((v.prod&&v.prod['Tablet'])||0),0))}</td>`:'';
   const lTot=`<td class="liccol">${nf(VT.lic)}</td>`;
   const oTot=others.map(c=>`<td class="prodcol">${brl0(V.vend.reduce((a,v)=>a+((v.prod&&v.prod[c])||0),0))}</td>`).join('');
   tb.querySelector('tfoot').innerHTML=`<tr><td></td><td>Time</td><td>${brl0(V.meta_total)}</td><td class="val-money">${brl(VT.mrr)}</td><td style="text-align:right"><span class="pctlab low">${Math.round(pct)}%</span></td>${tTot}${lTot}${oTot}<td>${VT.n}</td><td class="hide-sm">${VT.reun}</td></tr>`;},'mrr');
 // semanal
 (function(){const b=$('#sm-v tbody');const nS=V.semlabels.length;const tr=Array(nS).fill(0),tmeta=Array(nS).fill(0);
   V.vend.forEach(v=>{const cells=v.sem.map((rz,i)=>{const m=Math.round(v.meta*V.wts[i]);tr[i]+=rz;tmeta[i]+=m;
       const fer=v.fsem&&v.fsem[i];
       if(fer) return `<td class="wk fer" title="Vendedor de férias nesta semana"><b>férias</b>${rz>0?'<span>+'+brl0(rz).replace('R$ ','')+'</span>':''}</td>`;
       return `<td class="wk ${rz>=m?'hit':'miss'}"><b>${brl0(rz).replace('R$ ','')}</b><span>/${brl0(m).replace('R$ ','')}</span></td>`;}).join('');
     const tot=v.sem.reduce((a,b)=>a+b,0);const anyf=v.fsem&&v.fsem.some(x=>x);
     b.appendChild(el('tr',null,`<td>${nomeSr(v)}${anyf?' <span class="ftag">férias</span>':''}</td>`+cells+`<td class="wk ${tot>=v.meta?'hit':'miss'}"><b>${brl0(tot).replace('R$ ','')}</b><span>/${brl0(v.meta).replace('R$ ','')}</span></td>`));});
   const tM=tr.reduce((a,b)=>a+b,0);
   $('#sm-v tfoot').innerHTML=`<tr><td>Time</td>`+tr.map((v,i)=>`<td class="wk ${v>=tmeta[i]?'hit':'miss'}"><b>${brl0(v).replace('R$ ','')}</b><span>/${brl0(tmeta[i]).replace('R$ ','')}</span></td>`).join('')+`<td class="wk ${tM>=V.meta_total?'hit':'miss'}"><b>${brl0(tM).replace('R$ ','')}</b><span>/${brl0(V.meta_total).replace('R$ ','')}</span></td></tr>`;})();
 // oportunidades
 (function(){const tb=$('#rk-o');const oT={rec:0,g:0};V.oppv.forEach(o=>{o.win=o.rec?o.ganhas/o.rec*100:0;oT.rec+=o.rec;oT.g+=o.ganhas;});const pcw=w=>w>=30?'over':w>=18?'mid':'low';
   sortTable(tb,V.oppv,(rows)=>{const b=tb.querySelector('tbody');b.innerHTML='';
     rows.forEach((o,i)=>b.appendChild(el('tr',null,`<td class="pos">${o.ferias?'–':i+1}</td><td class="nome">${nomeSr(o)}</td><td>${o.rec}</td><td>${o.ganhas}</td><td>${o.ferias?'<span class="pctlab fer">férias</span>':'<span class="pctlab '+pcw(o.win)+'">'+pctr(o.win)+'</span>'}</td>`)));
     tb.querySelector('tfoot').innerHTML=`<tr><td></td><td>Time</td><td>${oT.rec}</td><td>${oT.g}</td><td style="text-align:right"><span class="pctlab mid">${pctr(oT.g/oT.rec*100)}</span></td></tr>`;},'win');})();
 // funil por vendedor
 (function(){const sel=$('#fsel');const names=Object.keys(V.funnel);sel.innerHTML=names.map(n=>'<option>'+n+'</option>').join('');
   function draw(nm){const rows=V.funnel[nm]||[];const b=$('#fun-v tbody');b.innerHTML='';let tn=0,tv=0;
     rows.forEach(r=>{tn+=r[1];tv+=r[2];b.appendChild(el('tr',null,`<td style="text-align:left">${r[0]}</td><td>${r[1]}</td><td class="val-money">${brl(r[2])}</td>`));});
     $('#fun-v tfoot').innerHTML=`<tr><td>Total</td><td>${tn}</td><td class="val-money">${brl(tv)}</td></tr>`;}
   sel.addEventListener('change',()=>draw(sel.value));if(names.length)draw(names[0]);})();
 // highlights
 const ativos=V.vend.filter(v=>!v.ferias);
 const topPct=[...ativos].sort((a,b)=>b.pct-a.pct)[0];
 const maxN=[...ativos].sort((a,b)=>b.n-a.n)[0];const maxR=[...ativos].sort((a,b)=>b.reun-a.reun)[0];
 const novos=Object.entries(V.novos||{}).sort((a,b)=>b[1]-a[1])[0];
 const win=[...V.oppv].filter(o=>!o.ferias&&o.rec>=5).sort((a,b)=>(b.ganhas/b.rec)-(a.ganhas/a.rec))[0];
 let jump={nome:'',v:-1e9};ativos.forEach(v=>{const n=v.sem.length;for(let i=1;i<n;i++){const j=v.sem[i]-v.sem[i-1];if(j>jump.v)jump={nome:v.first,v:j};}});
 $('#hl-v').innerHTML=[
   ['🏆 Destaque do mês',topPct.first+' · '+pctr(topPct.pct),'maior atingimento da meta'],
   ['Mais clientes novos',novos?novos[0].split(' ')[0]+' · '+novos[1]:'—','novos logos no mês'],
   ['Melhor conversão',win?win.nome.split(' ')[0]+' · '+pctr(win.ganhas/win.rec*100):'—','win rate das oportunidades'],
   ['Mais fechamentos',maxN.first+' · '+maxN.n,'negócios fechados'],
   ['Mais reuniões',maxR.first+' · '+maxR.reun,'reuniões realizadas'],
   ['Maior alta semana→semana',jump.nome,'+'+brl0(jump.v)+' de uma semana pra outra'],
 ].map(h=>`<div class="hlc"><div class="t">${h[0]}</div><div class="big">${h[1]}</div><div class="s">${h[2]}</div></div>`).join('');
 // maior venda semana
 $('#wbig').innerHTML=V.maiorsem.map(m=>{const x=m.x||{};return `<div class="wb"><div class="wkn">${m.w}</div><div class="cli">${x.cliente||'—'}</div><div class="cid">${x.cidade||''}</div><div class="vv">${x.valor?brl(x.valor):'—'}</div><div class="vd">${x.vendedor||''}</div></div>`;}).join('');
 // charts
 const vl=ativos.map(v=>v.first);
 new Chart($('#c-vmeta'),{type:'bar',data:{labels:vl,datasets:[{label:'Meta',data:ativos.map(v=>v.meta),backgroundColor:'#e7e9f2',borderRadius:6,barPercentage:.9,categoryPercentage:.62},{label:'MRR',data:ativos.map(v=>v.mrr),backgroundColor:ativos.map(v=>v.pct>=100?'#ff9700':'#1d84ff'),borderRadius:6,barPercentage:.9,categoryPercentage:.62}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,usePointStyle:true,pointStyle:'circle',font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+brl(c.parsed.y)}}},scales:{y:{beginAtZero:true,grid:{color:'#eef0f7'},ticks:{callback:v=>'R$ '+(v/1000)+'k'}},x:{grid:{display:false}}}}});
 new Chart($('#c-vprod'),{type:'doughnut',data:{labels:V.prodv.map(p=>p[0]),datasets:[{data:V.prodv.map(p=>p[1]),backgroundColor:['#2b00ff','#ff9700','#1d84ff','#8aa0d8','#12b76a','#d5d9e8'],borderWidth:2,borderColor:'#fff'}]},options:{maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{boxWidth:10,usePointStyle:true,pointStyle:'circle',font:{size:11}}},tooltip:{callbacks:{label:c=>c.label+': '+brl(c.parsed)}}}}});
}

// ===================== R&F (lazy) =====================
let rfBuilt=false;
function buildRF(){const P=$('#p-rf');const R=DATA.rf;if(!R){P.innerHTML='<p class="hint" style="margin-top:24px">Sem dados de R&F.</p>';return;}
 const tot=R.membros.reduce((a,r)=>({reun:a.reun+r.reun,ch:a.ch+r.chamadas,mrr:a.mrr+r.mrr}),{reun:0,ch:0,mrr:0});
 P.innerHTML=`
  <section><div class="sec-title">Redes & Franquias <span class="sec-note">· atividade e pipeline de marcas</span></div>
   <div class="kpis">
    <div class="kpi"><div class="k">Reuniões (mês)</div><div class="v num">${tot.reun}</div><div class="note">com marcas/redes</div></div>
    <div class="kpi"><div class="k">Marcas distintas</div><div class="v num">${R.marcas}</div><div class="note">no pipeline</div></div>
    <div class="kpi"><div class="k">Chamadas (mês)</div><div class="v num">${tot.ch}</div><div class="note">total do time</div></div>
    <div class="kpi"><div class="k">MRR gerado</div><div class="v num">${brl0(tot.mrr)}</div><div class="note">negócios fechados no mês</div></div>
   </div></section>
  <section><div class="sec-title">Atividade por integrante</div>
   <div class="card"><table id="rf-t"><thead><tr><th>Integrante</th><th>Reuniões</th><th>Chamadas</th><th>MRR gerado</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div></section>
  <section><div class="sec-title">Funil de marcas · Redes <span class="sec-note">· clique numa barra pra ver as marcas da etapa</span></div>
   <div class="chartbox"><h3>Entradas de marcas por etapa</h3><p>${R.marcas} marcas no pipeline de Redes</p><div class="cvs" style="height:340px"><canvas id="c-marcas"></canvas></div></div>
   <div class="marcas-box" id="mbox"><span class="hint">Clique numa barra do gráfico pra listar as marcas daquela etapa.</span></div></section>`;
 const b=$('#rf-t tbody');R.membros.forEach(r=>b.appendChild(el('tr',null,`<td class="nome">${r.nome}</td><td>${r.reun}</td><td>${r.chamadas}</td><td class="val-money">${brl0(r.mrr)}</td>`)));
 $('#rf-t tfoot').innerHTML=`<tr><td>Total</td><td>${tot.reun}</td><td>${tot.ch}</td><td class="val-money">${brl0(tot.mrr)}</td></tr>`;
 const labels=R.etapas.map(e=>e[0]);
 new Chart($('#c-marcas'),{type:'bar',
   data:{labels:labels,datasets:[{data:R.etapas.map(e=>e[1]),backgroundColor:'#2b00ff',hoverBackgroundColor:'#ff9700',borderRadius:5}]},
   options:{indexAxis:'y',maintainAspectRatio:false,
     plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.x+' marcas · clique pra ver'}}},
     scales:{x:{beginAtZero:true,grid:{color:'#eef0f7'},ticks:{precision:0}},y:{grid:{display:false}}},
     onClick:function(e,els){if(!els.length)return;var et=labels[els[0].index];var ms=R.marcas_por_etapa[et]||[];
       $('#mbox').innerHTML='<h4>'+et+' · '+ms.length+' marca(s)</h4><div class="chips">'+ms.map(function(m){return '<span class="mchip">'+m+'</span>';}).join('')+'</div>';}
   }
 });
}
// tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');document.getElementById('p-'+t.dataset.p).classList.add('on');
  if(t.dataset.p==='vendas'&&!vBuilt){buildV();vBuilt=true;}
  if(t.dataset.p==='rf'&&!rfBuilt){buildRF();rfBuilt=true;}
}));
</script>
</body></html>
